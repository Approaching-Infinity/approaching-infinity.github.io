name: Check website preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build and check owned contact and newsletter request mode
        env:
          CONTACT_FORM_URL: https://limitlesslp.com/contact-approaching-infinity.php
          CONTACT_FORM_APPROVED: 'true'
          NEWSLETTER_FORM_URL: https://limitlesslp.com/contact-approaching-infinity.php
          NEWSLETTER_FORM_APPROVED: 'true'
        run: |
          npm run build
          node scripts/check-owned-forms.mjs
