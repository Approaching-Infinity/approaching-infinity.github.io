name: Sync episodes from RSS

# Pulls any newly published episodes out of the podcast feed and commits them
# to src/content/episodes/. Existing files are never modified, so hand-written
# copy and embed IDs survive. If nothing new aired, this is a no-op.
#
# Run it by hand any time from the Actions tab -> "Sync episodes from RSS" ->
# "Run workflow". That is the button to press after publishing an episode if
# you do not want to wait for the next scheduled run.

on:
  schedule:
    # Twice daily (13:10 and 22:10 UTC), so a new episode is live on the site
    # within hours of hitting the feed.
    - cron: "10 13,22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "sync-episodes"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync episodes from the feed
        run: node scripts/sync-episodes.mjs

      - name: Verify the site still builds
        run: npm run build

      - name: Commit new episodes
        id: commit
        run: |
          if [ -z "$(git status --porcelain src/content/episodes)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new episodes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/episodes
          COUNT=$(git diff --cached --name-only --diff-filter=A | wc -l | tr -d ' ')
          git commit -m "content: sync ${COUNT} new episode(s) from the podcast feed"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # deploy has to be dispatched explicitly.
      - name: Deploy the updated site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
